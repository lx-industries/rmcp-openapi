# Shared CI templates for rmcp-openapi

# sccache configuration for build caching
.sccache-rust:
  variables:
    RUSTC_WRAPPER: "sccache"
    SCCACHE_LOG: "warn"
  before_script:
    - sccache --version || true

# Docker-in-Docker variables (reusable anchor)
.docker-in-docker-variables: &docker-in-docker-variables
  DOCKER_TLS_CERTDIR: "/certs"

# Docker-in-Docker template
.docker-in-docker:
  image: docker:29.7.2-dind@sha256:360545c5305996eb06cc850c0e48f352809fc0930c66031fe46c370b70075c2b
  tags:
    - docker-in-docker
  services:
    - docker:29.7.2-dind@sha256:360545c5305996eb06cc850c0e48f352809fc0930c66031fe46c370b70075c2b
  variables:
    <<: *docker-in-docker-variables
  before_script:
    - docker info
